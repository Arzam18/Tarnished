name: Build Tarnished for Android ARM64

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld g++-aarch64-linux-gnu curl make

      - name: Build ARM64 Binary
        run: |
          make arm64 CXX="clang++ --target=aarch64-linux-gnu" HOST_CXX="g++"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-arm64
          path: tarnished
