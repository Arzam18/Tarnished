name: Tarnished Android ARM64 Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Build Tarnished for Android ARM64
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_API: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            g++ \
            curl \
            unzip \
            file \
            binutils

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          curl -L \
            -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          unzip -q \
            /tmp/cmdline-tools.zip \
            -d "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/latest/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          rm -rf "$SDK/cmdline-tools/latest/cmdline-tools"

          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          set +o pipefail

          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

          STATUS=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set Android compiler
        shell: bash
        run: |
          set -e

          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++"

          test -x "$CXX"

          echo "ANDROID_CXX=$CXX" >> "$GITHUB_ENV"

          echo "Android compiler:"
          "$CXX" --version

      - name: Download NNUE network
        shell: bash
        run: |
          set -e

          make download-net

          echo "Network:"
          cat network.txt

          NET="$(cat network.txt).bin"

          test -f "$NET"
          test -s "$NET"

          ls -lh "$NET"

      - name: Build NEON network permutation tool
        shell: bash
        run: |
          set -e

          g++ \
            -O3 \
            -std=c++20 \
            -DNDEBUG \
            -DTARNISHED_TARGET_NEON \
            -I. \
            -Isrc \
            preprocess/permute.cpp \
            src/parameters.cpp \
            -o preprocess/permute-neon

          test -x preprocess/permute-neon

          echo "Permutation tool:"
          file preprocess/permute-neon

      - name: Generate NEON processed network
        shell: bash
        run: |
          set -e

          NET="$(cat network.txt).bin"

          test -f "$NET"

          echo "Input network:"
          echo "$NET"

          echo "Generating processed.bin..."

          ./preprocess/permute-neon \
            "$NET" \
            processed.bin

          test -f processed.bin
          test -s processed.bin

          echo
          echo "Processed network:"
          ls -lh processed.bin

      - name: Build Tarnished Android ARM64
        shell: bash
        run: |
          set -e

          echo "Building Tarnished for Android ARM64..."

          "$ANDROID_CXX" \
            -O3 \
            -march=armv8-a \
            -fno-finite-math-only \
            -funroll-loops \
            -flto \
            -fuse-ld=lld \
            -std=c++20 \
            -DNDEBUG \
            -pthread \
            -static-libstdc++ \
            -DEVALFILE=\"processed.bin\" \
            src/*.cpp \
            src/external/format.cpp \
            -o tarnished-android-arm64

          test -f tarnished-android-arm64
          test -s tarnished-android-arm64

          echo
          echo "Android ARM64 binary:"
          ls -lh tarnished-android-arm64

      - name: Verify Android ARM64 binary
        shell: bash
        run: |
          set -e

          echo "===== FILE ====="
          file tarnished-android-arm64

          echo
          echo "===== ELF HEADER ====="
          readelf -h tarnished-android-arm64

          echo
          echo "===== ELF MACHINE ====="
          MACHINE="$(readelf -h tarnished-android-arm64 | grep 'Machine:')"
          echo "$MACHINE"

          echo "$MACHINE" | grep -qi 'AArch64'

          echo
          echo "===== ELF CLASS ====="
          CLASS="$(readelf -h tarnished-android-arm64 | grep 'Class:')"
          echo "$CLASS"

          echo "$CLASS" | grep -q 'ELF64'

          echo
          echo "===== REQUIRED SHARED LIBRARIES ====="

          NEEDED="$(readelf -d tarnished-android-arm64 | grep 'NEEDED' || true)"

          if echo "$NEEDED" | grep -q 'libc++_shared.so'; then
            echo "ERROR: libc++_shared.so is still required."
            echo "$NEEDED"
            exit 1
          fi

          if [ -n "$NEEDED" ]; then
            echo "$NEEDED"
          else
            echo "No dynamic library dependencies."
          fi

          echo
          echo "===== PROGRAM INTERPRETER ====="

          readelf -l tarnished-android-arm64 \
            | grep -i interpreter || true

          echo
          echo "SUCCESS:"
          echo "ARM64 Android binary built with static libc++ runtime."

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-android-arm64
          path: tarnished-android-arm64
          if-no-files-found: error
