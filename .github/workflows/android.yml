name: Tarnished Android ARM64 Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Build Tarnished for Android ARM64
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_API: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            curl \
            unzip \
            file \
            binutils

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          curl -L \
            -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          unzip -q \
            /tmp/cmdline-tools.zip \
            -d "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/latest/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          rm -rf "$SDK/cmdline-tools/latest/cmdline-tools"

          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          set +o pipefail

          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

          STATUS=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify NDK
        shell: bash
        run: |
          set -e

          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++"

          echo "Using compiler:"
          "$CXX" --version

      - name: Download sse2neon
        run: |
          curl -L \
            https://github.com/DLTcollab/sse2neon/raw/master/sse2neon.h \
            -o sse2neon.h

          test -s sse2neon.h

      - name: Patch SSE include
        shell: bash
        run: |
          set -e

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            python3 - "$file" <<'PY'
            import sys
            from pathlib import Path

            path = Path(sys.argv[1])
            text = path.read_text()

            old = "#include <immintrin.h>"

            new = """#if defined(__aarch64__) || defined(__ARM_NEON)
            #include "../sse2neon.h"
            #else
            #include <immintrin.h>
            #endif"""

            if old in text:
                path.write_text(text.replace(old, new))
                print("Patched:", path)
            PY

          done < <(
            grep -RIl \
              '#include <immintrin.h>' \
              src preprocess \
              2>/dev/null || true
          )

      - name: Download NNUE network
        run: |
          make download-net

      - name: Build permutation tool
        shell: bash
        run: |
          set -e

          g++ \
            -O3 \
            -std=c++20 \
            -I. \
            -I./src \
            preprocess/permute.cpp \
            src/parameters.cpp \
            -o preprocess/permute

          test -x preprocess/permute

      - name: Generate processed network
        shell: bash
        run: |
          set -e

          ./preprocess/permute

          echo "Generated network files:"

          find . -maxdepth 3 -type f \
            \( -name "*.bin" -o -name "*.nnue" \) \
            -printf '%p %s bytes\n' \
            | sort

      - name: Build Tarnished Android ARM64
        shell: bash
        run: |
          set -e

          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++"

          echo "Building with:"
          echo "$CXX"

          make native \
            CXX="$CXX" \
            ARCH="-march=armv8-a" \
            LDFLAGS="-static-libstdc++" \
            EXE="tarnished-android-arm64"

          test -f tarnished-android-arm64

          ls -lh tarnished-android-arm64

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -e

          echo "File:"
          file tarnished-android-arm64

          echo
          echo "ELF header:"
          readelf -h tarnished-android-arm64

          echo
          echo "Interpreter:"
          readelf -l tarnished-android-arm64 \
            | grep -i interpreter || true

          echo
          echo "Checking AArch64:"

          file tarnished-android-arm64 \
            | grep -Eiq 'aarch64|ARM aarch64|ARM64'

          echo
          echo "Checking ELF64:"

          readelf -h tarnished-android-arm64 \
            | grep -q 'ELF64'

          echo
          echo "SUCCESS: Android ARM64 binary verified."

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-android-arm64
          path: tarnished-android-arm64
          if-no-files-found: error
