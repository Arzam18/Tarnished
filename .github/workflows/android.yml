name: Tarnished Android ARM64 Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-arm64:
    name: Build Tarnished for Android ARM64
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.2.12479018"

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # Install host dependencies
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            g++ \
            curl \
            qemu-user

      # =========================================================
      # Configure Android NDK
      # =========================================================
      - name: Configure Android NDK
        shell: bash
        run: |
          set -e

          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          ANDROID_NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "Requested NDK:"
          echo "$NDK_VERSION"

          # -----------------------------------------------------
          # Install NDK if it is not already present.
          #
          # IMPORTANT:
          # GitHub Actions uses pipefail. `yes` receives SIGPIPE
          # when sdkmanager finishes, which can otherwise cause
          # the whole workflow to fail.
          # -----------------------------------------------------
          if [ ! -d "$ANDROID_NDK_ROOT" ]; then

            echo "Installing Android NDK $NDK_VERSION..."

            set +o pipefail
            yes | "$SDKMANAGER" "ndk;$NDK_VERSION"
            SDK_STATUS=${PIPESTATUS[1]}
            set -o pipefail

            if [ "$SDK_STATUS" -ne 0 ]; then
              echo "ERROR: sdkmanager failed with status $SDK_STATUS"
              exit "$SDK_STATUS"
            fi

          else
            echo "Android NDK already installed."
          fi

          # -----------------------------------------------------
          # Verify NDK
          # -----------------------------------------------------
          if [ ! -d "$ANDROID_NDK_ROOT" ]; then
            echo "ERROR: NDK directory does not exist:"
            echo "$ANDROID_NDK_ROOT"
            exit 1
          fi

          if [ ! -x "$ANDROID_NDK_BIN/aarch64-linux-android35-clang++" ]; then
            echo "ERROR: ARM64 compiler not found:"
            echo "$ANDROID_NDK_BIN/aarch64-linux-android35-clang++"
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_PREFIX=$ANDROID_NDK_BIN/aarch64-linux-android35-" >> "$GITHUB_ENV"

          echo
          echo "NDK installed successfully:"
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "ARM64 compiler:"
          "$ANDROID_NDK_BIN/aarch64-linux-android35-clang++" --version

      # =========================================================
      # Download sse2neon
      # =========================================================
      - name: Download sse2neon
        shell: bash
        run: |
          set -e

          curl -fL \
            https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h \
            -o sse2neon.h

          test -s sse2neon.h

          echo "sse2neon.h downloaded successfully."
          wc -c sse2neon.h

      # =========================================================
      # Patch x86 SIMD includes
      # =========================================================
      - name: Patch SIMD includes for ARM64
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import os

          skip_dirs = {
              ".git",
              ".github",
              "build",
              "dist",
          }

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in skip_dirs
              ]

              for filename in files:

                  if not filename.endswith(
                      (".cpp", ".cc", ".c", ".h", ".hpp")
                  ):
                      continue

                  path = os.path.join(root, filename)

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8",
                          errors="ignore"
                      ) as f:
                          content = f.read()
                  except Exception:
                      continue

                  original = content

                  content = content.replace(
                      "#include <immintrin.h>",
                      """#if defined(__aarch64__) || defined(__ARM_NEON)
          #include "sse2neon.h"
          #else
          #include <immintrin.h>
          #endif"""
                  )

                  if content != original:

                      with open(
                          path,
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(content)

                      print("Patched:", path)
          PY

      # =========================================================
      # Download NNUE network
      # =========================================================
      - name: Download NNUE network
        shell: bash
        run: |
          set -e

          make download-net

          NETWORK="$(cat network.txt).bin"

          echo "Network:"
          echo "$NETWORK"

          test -f "$NETWORK"
          test -s "$NETWORK"

          ls -lh "$NETWORK"

      # =========================================================
      # Build host network preprocessor
      # =========================================================
      - name: Build network preprocessor
        shell: bash
        run: |
          set -e

          rm -f preprocess/permute

          g++ \
            -O3 \
            -std=c++20 \
            -I. \
            -I./src \
            preprocess/permute.cpp \
            src/parameters.cpp \
            -o preprocess/permute

          test -x preprocess/permute

          echo "Network preprocessor built successfully."

      # =========================================================
      # Generate processed NNUE network
      # =========================================================
      - name: Generate processed network
        shell: bash
        run: |
          set -e

          NETWORK="$(cat network.txt).bin"

          echo "Input network:"
          echo "$NETWORK"

          echo "Output:"
          echo "processed.bin"

          rm -f processed.bin

          ./preprocess/permute \
            "$NETWORK" \
            processed.bin

          test -f processed.bin
          test -s processed.bin

          echo
          echo "Processed network:"
          ls -lh processed.bin

      # =========================================================
      # Compile Tarnished ARM64
      #
      # DO NOT override CXXFLAGS.
      #
      # The Makefile already generates:
      #
      # -DEVALFILE=\"processed.bin\"
      #
      # This avoids the previous EVALFILE quoting failure.
      # =========================================================
      - name: Compile Tarnished ARM64
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_NDK_BIN:$PATH"

          echo "Compiler:"
          "$TOOLCHAIN_PREFIX"clang++ --version

          echo
          echo "Building Tarnished ARM64..."

          make native \
            CXX="${TOOLCHAIN_PREFIX}clang++" \
            ARCH="-march=armv8-a" \
            LDFLAGS="-static-libstdc++" \
            EXE=tarnished-android-arm64

          test -f tarnished-android-arm64
          test -s tarnished-android-arm64

          echo
          echo "Build successful."

          ls -lh tarnished-android-arm64

      # =========================================================
      # Verify executable architecture
      # =========================================================
      - name: Verify ARM64 executable
        shell: bash
        run: |
          set -e

          file tarnished-android-arm64

          file tarnished-android-arm64 | grep -Eiq \
            "aarch64|ARM aarch64|ARM64"

          echo "ARM64 verification successful."

      # =========================================================
      # Run ARM64 bench under QEMU
      # =========================================================
      - name: Run ARM64 bench
        shell: bash
        run: |
          set -e

          echo "Running Tarnished ARM64 bench..."

          qemu-aarch64 \
            ./tarnished-android-arm64 \
            bench

      # =========================================================
      # Upload artifact
      # =========================================================
      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-android-arm64
          path: tarnished-android-arm64
          if-no-files-found: error
