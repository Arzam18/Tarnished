    - name: Compile Tarnished for Android (aarch64)
      run: |
        export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH

        # Download the network
        make download-net

        # Build the network preprocessor for the host
        g++ -O3 -std=c++20 -I. -I./src \
          preprocess/permute.cpp src/parameters.cpp \
          -o preprocess/permute

        # Generate the ARM-targeted processed network
        ./preprocess/permute $(cat network.txt).bin processed.bin

        # Build Tarnished for Android ARM64
        make native \
          CXX="${{ env.TOOLCHAIN_PREFIX }}clang++" \
          ARCH="-march=armv8-a" \
          CXXFLAGS="-O3 -march=armv8-a -fno-finite-math-only -funroll-loops -flto -std=c++20 -stdlib=libc++ -fexperimental-library -DNDEBUG -pthread -DEVALFILE=\\\"processed.bin\\\"" \
          LDFLAGS="-fuse-ld=lld -static-libstdc++" \
          EXE=tarnished-android-arm64
