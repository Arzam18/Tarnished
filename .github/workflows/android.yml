name: Build Tarnished for Android ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Engine Binary
        run: |
          make arm64 \
            CXX="clang++ --target=aarch64-linux-gnu -static" \
            HOST_CXX="g++"

      - name: Upload Android Executable
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-android-arm64
          path: tarnished
