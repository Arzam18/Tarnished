name: Tarnished Android ARM64 Build

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-arm64:
    name: Build Tarnished for Android ARM64
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_API: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            g++ \
            curl \
            unzip \
            file \
            binutils

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            curl -L \
              -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

            unzip -q \
              /tmp/cmdline-tools.zip \
              -d "$ANDROID_SDK_ROOT/cmdline-tools/latest"

            mv \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/"* \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

            rm -rf \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools"

            rm -f /tmp/cmdline-tools.zip
          fi

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          set +o pipefail
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

          status=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$status" -ne 0 ]; then
            echo "sdkmanager failed with status $status"
            exit "$status"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Android NDK
        shell: bash
        run: |
          set -e

          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

          echo
          echo "Clang:"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++" \
            --version

      - name: Download sse2neon
        shell: bash
        run: |
          set -e

          curl -L \
            https://github.com/DLTcollab/sse2neon/raw/master/sse2neon.h \
            -o sse2neon.h

          test -s sse2neon.h

      - name: Patch SSE include for ARM
        shell: bash
        run: |
          set -e

          echo "Searching for immintrin.h includes..."

          grep -RIl \
            '#include <immintrin.h>' \
            src preprocess \
            2>/dev/null || true

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            python3 - "$file" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])

text = path.read_text()

old = '#include <immintrin.h>'

new = r'''#if defined(__aarch64__) || defined(__ARM_NEON)
#include "../sse2neon.h"
#else
#include <immintrin.h>
#endif'''

if old in text:
    text = text.replace(old, new)
    path.write_text(text)
    print(f"Patched: {path}")
PY

          done < <(
            grep -RIl \
              '#include <immintrin.h>' \
              src preprocess \
              2>/dev/null || true
          )

      - name: Show ARM SIMD configuration
        shell: bash
        run: |
          set -e

          echo "Checking SIMD source..."

          grep -n \
            -E 'aarch64|ARM_NEON|NEON|sse2neon' \
            src/simd.h \
            src/nnue.cpp \
            2>/dev/null || true

      - name: Download NNUE network
        shell: bash
        run: |
          set -e

          make download-net

      - name: Build host permutation tool
        shell: bash
        run: |
          set -e

          mkdir -p preprocess/build

          g++ \
            -O3 \
            -std=c++17 \
            preprocess/permute.cpp \
            -o preprocess/permute

          test -x preprocess/permute

          echo "Permutation tool built successfully."

      - name: Generate processed NNUE file
        shell: bash
        run: |
          set -e

          ./preprocess/permute

          echo
          echo "Generated files:"
          find . -maxdepth 3 -type f \
            \( -name "*.bin" -o -name "*.nnue" \) \
            -printf '%p %s bytes\n' \
            | sort

      - name: Build Android ARM64 binary
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          AARCH64_CXX="aarch64-linux-android${ANDROID_API}-clang++"

          echo "Compiler:"
          "$AARCH64_CXX" --version

          echo
          echo "Building Tarnished..."

          make native \
            CXX="$AARCH64_CXX" \
            ARCH="-march=armv8-a" \
            LDFLAGS="-static-libstdc++" \
            EXE="tarnished-android-arm64"

          test -f tarnished-android-arm64

          echo
          echo "Binary created:"
          ls -lh tarnished-android-arm64

      - name: Verify Android ARM64 executable
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Android ARM64 executable verification"
          echo "========================================"

          test -f tarnished-android-arm64

          echo
          echo "File information:"
          file tarnished-android-arm64

          echo
          echo "ELF header:"
          readelf -h tarnished-android-arm64

          echo
          echo "ELF interpreter:"
          readelf -l tarnished-android-arm64 \
            | grep -i interpreter || true

          echo
          echo "Machine architecture:"

          readelf -h tarnished-android-arm64 \
            | grep -E 'Class:|Machine:'

          echo
          echo "Checking for AArch64..."

          file tarnished-android-arm64 \
            | grep -Eiq 'aarch64|ARM aarch64|ARM64'

          echo
          echo "Checking Android ELF..."

          readelf -h tarnished-android-arm64 \
            | grep -q 'ELF64'

          echo
          echo "Android ARM64 executable verified successfully."

      - name: Show binary dependencies
        shell: bash
        run: |
          set -e

          echo "Dynamic dependencies/interpreter:"
          readelf -d tarnished-android-arm64 2>/dev/null || true

          echo
          echo "Program interpreter:"
          readelf -l tarnished-android-arm64 \
            | grep -i interpreter || true

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-android-arm64
          path: tarnished-android-arm64
          if-no-files-found: error
